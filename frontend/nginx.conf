worker_processes auto;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 4k;
  client_body_timeout 5s;
  client_header_timeout 5s;
  keepalive_timeout 15s;
  limit_req_zone $binary_remote_addr zone=scan_requests:10m rate=6r/m;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location = /api/scans {
      limit_req zone=scan_requests burst=2 nodelay;
      limit_req_status 429;
      proxy_pass http://api:8000/api/scans;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 100s;
    }

    location ^~ /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 100s;
    }

    location = /docs { proxy_pass http://api:8000/docs; }
    location = /openapi.json { proxy_pass http://api:8000/openapi.json; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
